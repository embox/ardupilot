TARGET = embox

PLATFORM = virt

ARCH = riscv

CROSS_COMPILE = riscv64-unknown-elf-

CFLAGS += -g -O0
CFLAGS += -march=rv32imfdc_zicsr_zifencei -mabi=ilp32d
CFLAGS += -falign-functions -falign-jumps -falign-labels -falign-loops

CXXFLAGS += -g -O0
CXXFLAGS += -march=rv32imfdc_zicsr_zifencei -mabi=ilp32d
CXXFLAGS += -falign-functions -falign-jumps -falign-labels -falign-loops
CXXFLAGS += -fno-threadsafe-statics

LDFLAGS += -melf32lriscv
