package genconfig

configuration conf {
	include embox.arch.system(core_freq=1000000000)
	include embox.arch.riscv.kernel.locore
	include embox.arch.riscv.kernel.context
	include embox.arch.riscv.libarch
	include embox.arch.riscv.vfork
	include embox.arch.riscv.pmp
	include embox.arch.riscv.mmuinfo
	include embox.arch.riscv.mmu_sv39_mode

	include embox.driver.serial.ns16550(reg_width=1)
	include embox.driver.serial.ns16550_diag(base_addr=0x10000000)
	include embox.driver.serial.ns16550_ttyS0(base_addr=0x10000000, irq_num=10)
	include embox.driver.serial.ns16550_ttyS1(base_addr=0x1000a000, irq_num=12)
	include embox.driver.diag(impl="embox__driver__serial__ns16550_diag")

	include embox.driver.interrupt.riscv_plic
	include embox.driver.clock.riscv_mtimer(rtc_freq=10000000)
	include embox.kernel.time.jiffies(cs_name="riscv_mtimer")

	include embox.driver.i2c_core
	include embox.driver.spi.core(use_cs=false)

	include embox.driver.pwm.skeleton_pwm_drv(log_level="LOG_ERR")
	include embox.driver.pwm.skeleton_pwm0(use_dma=true, timer_freq=10000000)
	include embox.driver.pwm.skeleton_pwm1(use_dma=true, timer_freq=10000000)
	include embox.driver.pwm.skeleton_pwm2(use_dma=true, timer_freq=10000000)
	include embox.driver.pwm.skeleton_pwm3(use_dma=true, timer_freq=10000000)
	include embox.driver.motor.esc_motor.esc_motor1(pwm_id=0, pwm_chan=0)
	include embox.driver.motor.esc_motor.esc_motor2(pwm_id=1, pwm_chan=0)
	include embox.driver.motor.esc_motor.esc_motor3(pwm_id=2, pwm_chan=0)
	include embox.driver.motor.esc_motor.esc_motor4(pwm_id=3, pwm_chan=0)

	@Runlevel(2) include embox.driver.net.loopback

	@Runlevel(2) include embox.kernel.irq

	include embox.kernel.spinlock(spin_debug=false)
	
	include embox.kernel.critical

	include embox.kernel.task.multi
	include embox.kernel.task.resource.idesc_table(idesc_table_size=32)
	include embox.kernel.task.resource.sig_table(sig_table_size=20)
	include embox.kernel.task.resource.env(env_per_task=4,env_str_len=64)

	include embox.kernel.thread.thread_cancel_disable
	include embox.kernel.thread.signal.siginfoq(siginfo_pool_sz=4)
	include embox.kernel.timer.sleep
	include embox.kernel.sched.sched
	include embox.kernel.sched.idle_light
	include embox.kernel.lthread.lthread
	include embox.kernel.thread.core(thread_stack_size=0x20000,thread_pool_size=6)
	include embox.kernel.stack(stack_size=0x20000)

	/* tty requires */
	include embox.kernel.thread.mutex
	include embox.driver.tty.tty(rx_buff_sz=512, io_buff_sz=512)
	include embox.driver.tty.task_breaking_disable

	include embox.lib.libds
	include embox.framework.LibFramework

	include embox.framework.unit
	include embox.framework.mod(
		use_mod_depends=false,
		use_mod_labels=false,
		use_mod_logger=false,
		use_mod_names=true,
		use_cmd_details=false)

	include embox.util.log(max_log_level="LOG_INFO")

	include embox.compat.atomic.pseudo_atomic

	include embox.compat.libc.stdio.print(support_floating=0)
	include embox.compat.libc.stdio.printf
	include embox.compat.libc.stdio.asprintf
	include embox.compat.libc.stdio.scanf
	include embox.compat.libc.stdio.file_ops

	include embox.compat.libc.math_openlibm

	include embox.compat.posix.time.nanosleep
	include embox.compat.posix.util.gethostname

	include embox.compat.posix.pthread_key
	include embox.compat.posix.pthread.pthread_barrier
	include embox.compat.posix.time.time

	@Runlevel(0) include embox.mem.phymem

	include embox.mem.pool_adapter
	@Runlevel(2) include embox.mem.static_heap(heap_size=0x80000)
	include embox.mem.heap_bm(heap_size=0x80000)
	include embox.mem.bitmask

	include embox.fs.driver.initfs_dvfs(file_quantity=32)
	include embox.fs.driver.devfs_dvfs
	include embox.fs.rootfs_dvfs(fstype="initfs")
	include embox.fs.dvfs.core
	include embox.compat.posix.file_system_dvfs
	include embox.fs.syslib.perm_stub

	include embox.net.skbuff(amount_skb=10)
	include embox.net.skbuff_data(amount_skb_data=10)
	@Runlevel(2) include embox.net.socket
	@Runlevel(2) include embox.net.dev
	@Runlevel(2) include embox.net.af_inet
	@Runlevel(2) include embox.net.af_packet
	@Runlevel(2) include embox.net.ipv4
	@Runlevel(2) include embox.net.arp
	@Runlevel(2) include embox.net.rarp
	@Runlevel(2) include embox.net.icmpv4
	@Runlevel(2) include embox.net.udp
	@Runlevel(2) include embox.net.tcp
	@Runlevel(2) include embox.net.udp_sock
	@Runlevel(2) include embox.net.tcp_sock
	@Runlevel(2) include embox.net.raw_sock
	@Runlevel(2) include embox.net.net_entry

	include embox.init.system_start_service(log_level="LOG_INFO", tty_dev="ttyS0", cmd_max_len=128)

	include embox.cmd.sh.tish(prompt="%u@%h:%w%$", rich_prompt_support=1,
		builtin_commands="cd exit logout")

	@Runlevel(2) include embox.cxx.ConstructionSingleApp
	include embox.cxx.cxxabi(cxa_atexit_table_size=1024)
	include third_party.gcc.libstdcxx

	include ext_project.ardupilot.arducopter(board="embox", flags="--debug")
}

