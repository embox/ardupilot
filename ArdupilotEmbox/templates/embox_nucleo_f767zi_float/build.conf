TARGET = embox

ARCH = arm

CHIP_VENDOR = stm32
PLATFORM_VENDOR = stm32
PLATFORM = nucleo_f767zi

CROSS_COMPILE = arm-none-eabi-

// OPTIMIZATION_FLAGS =  -g3 -O0
OPTIMIZATION_FLAGS = -g3 -O2

/* Switch between FPU and non-FPU modes */
// FLOAT_POINT_FLAGS = -msoft-float -mfloat-abi=soft
 FLOAT_POINT_FLAGS = -mfpu=fpv5-sp-d16 -mfloat-abi=hard

/* FIXME: It's right: ARCH_FLAGS += -mtune=cortex-m7 -march=armv7-m */
ARCH_FLAGS = -mcpu=cortex-m7
ARCH_FLAGS += -mthumb -mlittle-endian
ARCH_FLAGS += $(FLOAT_POINT_FLAGS)

CFLAGS += $(OPTIMIZATION_FLAGS)
CFLAGS += $(ARCH_FLAGS)
CFLAGS += -ffreestanding

CXXFLAGS += $(OPTIMIZATION_FLAGS)
CXXFLAGS += $(ARCH_FLAGS)
CXXFLAGS += -fno-threadsafe-statics
CXXFLAGS += -ffp-contract=off

